name: CI

on:
  pull_request:
    branches: [main]
  # Vía manual de respaldo: en este repo se detectó que push/pull_request no
  # disparan Actions de forma confiable (bug reportado a GitHub Support).
  # Mientras se resuelve, "Run workflow" en la pestaña Actions funciona siempre.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Variables NEXT_PUBLIC_* de solo lectura para que el build/E2E de CI no dependan
  # de secretos reales: son valores públicos por diseño (van al bundle del cliente),
  # no credenciales. La conexión real a Supabase no se ejercita en este pipeline.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  # obtenerEntornoServidor() (src/lib/env.ts) valida TODO el esquema de entorno
  # server-only en conjunto la primera vez que cualquier Server Component llama a
  # crearClienteSupabaseServidor() — no solo las variables que esa página puntual
  # usa. Antes de la vidriera pública ningún test E2E ejercitaba ese código path
  # sin sesión, así que la ausencia de estas variables nunca se notó en CI. No
  # necesitan ser reales: alcanza con que el esquema Zod las vea presentes: la
  # URL de Supabase de arriba ya es un placeholder no conectable, así que
  # cualquier request real a Supabase/Upstash/Cloudinary falla por red, no por
  # falta de configuración — el código ya maneja ese caso (NX-WEB-004/degradación
  # controlada), que es justamente lo que e2e/vidriera-publica.spec.ts verifica.
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: ci-placeholder-upstash-token
  CLOUDINARY_CLOUD_NAME: ci-placeholder-cloud-name
  CLOUDINARY_API_KEY: ci-placeholder-api-key
  CLOUDINARY_API_SECRET: ci-placeholder-api-secret
  OPENAI_API_KEY: ci-placeholder-openai-key

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Tipado (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next build genera .next/types (LayoutProps/PageProps) antes del chequeo real;
      # sin este paso tsc falla con falsos positivos en rutas tipadas de Next.js.
      - run: npm run build
      - run: npx tsc --noEmit

  unit-tests:
    name: Pruebas unitarias (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  e2e-tests:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ci-ok:
    name: CI (requerido para mergear)
    if: ${{ !cancelled() }}
    needs: [lint, typecheck, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos los jobs anteriores pasaron
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Al menos un job del pipeline falló o fue cancelado."
            exit 1
          fi
